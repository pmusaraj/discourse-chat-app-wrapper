name: Initialize update feed
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve an existing feed
        run: |
          mkdir -p feed
          url=https://pmusaraj.github.io/discourse-chat-wrapper/appcast.xml
          status=$(curl -sSL -o feed/appcast.xml -w '%{http_code}' "$url")
          if [ "$status" = 404 ]; then
            cp updates/appcast.xml feed/appcast.xml
          elif [ "$status" != 200 ]; then
            echo "Could not read existing feed ($status); refusing to replace it." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: feed
      - uses: actions/deploy-pages@v4
        id: deployment
