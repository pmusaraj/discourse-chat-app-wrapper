name: Initialize update feed
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve an existing feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p feed
          url=$(jq -r '.updates.feedURL' tinyjs.json)
          status=$(curl -sSL -o feed/appcast.xml -w '%{http_code}' "$url")
          if [ "$status" = 404 ]; then
            # A rename changes the Pages URL. Restore the latest published feed
            # instead of losing its release history at the new address.
            tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$tag" ]; then
              gh release download "$tag" --pattern appcast.xml --dir feed --clobber
            else
              cp updates/appcast.xml feed/appcast.xml
            fi
          elif [ "$status" != 200 ]; then
            echo "Could not read existing feed ($status); refusing to replace it." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: feed
      - uses: actions/deploy-pages@v4
        id: deployment
